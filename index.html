<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070b14">
  <title>LeakGuard Pro - Live Dashboard</title>

  <style>
    :root {
      --bg: #070b14;
      --card-bg: rgba(21, 30, 50, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --safe: #00f090;
      --safe-bg: rgba(0, 240, 144, 0.08);
      --safe-glow: rgba(0, 240, 144, 0.28);
      --alarm: #ff2a55;
      --alarm-bg: rgba(255, 42, 85, 0.22);
      --alarm-glow: rgba(255, 42, 85, 0.6);
      --warn: #ffb800;
      --warn-bg: rgba(255, 184, 0, 0.15);
      --warn-glow: rgba(255, 184, 0, 0.35);
      --text: #f1f5f9;
      --sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app-header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .connection-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--sub);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 8px var(--warn);
      transition: all 0.3s ease;
    }
    .dot.connected {
      background: var(--safe);
      box-shadow: 0 0 10px var(--safe);
    }

    /* Active Breached Zones Banner */
    .alert-banner {
      width: 100%;
      max-width: 440px;
      background: var(--alarm-bg);
      border: 2px solid var(--alarm);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 14px;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 20px var(--alarm-glow);
      animation: bannerPulse 1s infinite alternate ease-in-out;
    }
    @keyframes bannerPulse {
      from { transform: scale(0.99); opacity: 0.9; }
      to { transform: scale(1.01); opacity: 1; }
    }
    .alert-banner-icon {
      font-size: 1.5rem;
    }
    .alert-banner-text {
      display: flex;
      flex-direction: column;
    }
    .alert-banner-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--alarm);
      letter-spacing: 0.5px;
    }
    .alert-banner-zones {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
    }

    /* Master Status Ring */
    .status-orb-container {
      width: 200px;
      height: 200px;
      margin: 8px auto 20px auto;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--safe);
      box-shadow: 0 0 35px var(--safe-glow);
      animation: breathe 3s infinite alternate ease-in-out;
      transition: all 0.5s ease;
    }
    .orb-ring.alarm {
      border-color: var(--alarm);
      box-shadow: 0 0 55px var(--alarm-glow);
      animation: pulse-rapid 0.8s infinite ease-in-out;
    }
    .orb-ring.error {
      border-color: var(--warn);
      box-shadow: 0 0 35px var(--warn-glow);
      animation: none;
    }

    @keyframes breathe {
      0% { transform: scale(0.96); opacity: 0.75; }
      100% { transform: scale(1.02); opacity: 1; }
    }
    @keyframes pulse-rapid {
      0% { transform: scale(0.92); opacity: 0.6; }
      50% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(0.92); opacity: 0.6; }
    }

    .master-icon {
      width: 52px;
      height: 52px;
      margin-bottom: 6px;
      transition: fill 0.3s ease;
    }
    .master-status-text {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }
    .last-seen-text {
      font-size: 0.72rem;
      color: var(--sub);
      margin-top: 4px;
    }

    /* 4-Zone Cards Grid */
    .zone-container {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .zone-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .zone-card.alarm {
      border-color: var(--alarm);
      background: var(--alarm-bg);
      box-shadow: 0 0 25px var(--alarm-glow);
      animation: cardPulse 0.9s infinite alternate ease-in-out;
    }
    @keyframes cardPulse {
      from { transform: scale(0.99); }
      to { transform: scale(1.02); }
    }
    .zone-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .zone-card.alarm .zone-header {
      color: #ff99aa;
    }

    .zone-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--safe-bg);
      color: var(--safe);
      border: 1px solid rgba(0, 240, 144, 0.3);
      width: fit-content;
      transition: all 0.3s ease;
    }
    .zone-card.alarm .zone-status-badge {
      background: var(--alarm);
      color: #ffffff;
      border-color: var(--alarm);
      box-shadow: 0 0 12px var(--alarm);
    }
    .zone-card.fault .zone-status-badge {
      background: var(--warn-bg);
      color: var(--warn);
      border-color: var(--warn);
    }

    .badge-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    .audio-btn {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* Modal */
    #emergencyModal {
      position: fixed;
      inset: 0;
      background: rgba(10, 0, 4, 0.94);
      backdrop-filter: blur(20px);
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .alarm-symbol {
      width: 80px;
      height: 80px;
      fill: var(--alarm);
      filter: drop-shadow(0 0 25px var(--alarm));
      animation: pulse-rapid 0.6s infinite ease-in-out;
      margin-bottom: 16px;
    }
    .emergency-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .emergency-zones-box {
      background: rgba(255, 42, 85, 0.2);
      border: 2px solid var(--alarm);
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 24px;
      max-width: 320px;
      width: 100%;
    }
    .emergency-zones-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #ff99aa;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .emergency-zones {
      font-size: 1.25rem;
      color: #ffffff;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .dismiss-btn {
      background: var(--alarm);
      color: #ffffff;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 34px;
      border-radius: 30px;
      box-shadow: 0 0 30px var(--alarm-glow);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="brand-title">LEAKGUARD PRO</div>
    <div class="connection-badge">
      <div class="dot" id="connDot"></div>
      <span id="connText">Connecting...</span>
    </div>
  </div>

  <div class="alert-banner" id="alertBanner">
    <div class="alert-banner-icon">⚠️</div>
    <div class="alert-banner-text">
      <div class="alert-banner-title">Breached Zone Alert</div>
      <div class="alert-banner-zones" id="bannerZoneText">INLET PLUMBING</div>
    </div>
  </div>

  <div class="status-orb-container">
    <div class="orb-ring" id="orbRing"></div>
    <svg class="master-icon" id="masterIcon" viewBox="0 0 24 24" fill="var(--safe)">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
    </svg>
    <div class="master-status-text" id="masterStatusText">CONNECTING...</div>
    <div class="last-seen-text" id="lastSeenText">Syncing Blynk Cloud...</div>
  </div>

  <div class="zone-container">
    <div class="zone-card" id="cardInlet">
      <div class="zone-header">Inlet Plumbing</div>
      <div class="zone-status-badge"><div class="badge-icon"></div><span id="txtInlet">SYNCING</span></div>
    </div>
    <div class="zone-card" id="cardOutlet">
      <div class="zone-header">Outlet Plumbing</div>
      <div class="zone-status-badge"><div class="badge-icon"></div><span id="txtOutlet">SYNCING</span></div>
    </div>
    <div class="zone-card" id="cardUnit">
      <div class="zone-header">Unit Plumbing</div>
      <div class="zone-status-badge"><div class="badge-icon"></div><span id="txtUnit">SYNCING</span></div>
    </div>
    <div class="zone-card" id="cardExt">
      <div class="zone-header">External RS485</div>
      <div class="zone-status-badge"><div class="badge-icon"></div><span id="txtExt">SYNCING</span></div>
    </div>
  </div>

  <button class="audio-btn" id="soundBtn" onclick="enableAudioEngine()">🔔 Tap to Enable High-Decibel Siren</button>

  <div id="emergencyModal">
    <svg class="alarm-symbol" viewBox="0 0 24 24">
      <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
    </svg>
    <div class="emergency-title">CRITICAL LEAK DETECTED</div>
    <div class="emergency-zones-box">
      <div class="emergency-zones-title">Affected Location(s)</div>
      <div class="emergency-zones" id="modalZoneText">INLET PLUMBING</div>
    </div>
    <button class="dismiss-btn" onclick="dismissModal()">ACKNOWLEDGE & SILENCE</button>
  </div>

  <script>
    const BLYNK_AUTH = "YiCzpRDlxi5_-BMoMiQfM9lyFDnXgspV";

    let audioCtx = null;
    let alarmInterval = null;
    let isSilenced = false;

    function enableAudioEngine() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.getElementById('soundBtn').style.display = 'none';
    }

    function playSirenTone() {
      if (!audioCtx || isSilenced) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(950, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.28);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}

      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    function dismissModal() {
      document.getElementById('emergencyModal').style.display = 'none';
      isSilenced = true;
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    // Helper: Safely extracts pin value regardless of casing (v0 vs V0)
    function getPin(data, pinNum) {
      if (!data) return 0;
      const keyLow = 'v' + pinNum;
      const keyUp = 'V' + pinNum;
      const val = data[keyLow] !== undefined ? data[keyLow] : data[keyUp];
      return Number(val) || 0;
    }

    async function fetchAllPins() {
      // 1. Primary: Use Blynk's official getAll endpoint
      try {
        const res = await fetch(`https://blynk.cloud/external/api/getAll?token=${BLYNK_AUTH}`);
        if (res.ok) {
          const json = await res.json();
          if (json && (json.v0 !== undefined || json.V0 !== undefined)) {
            return json;
          }
        }
      } catch (e) {}

      // 2. Reliable Fallback: Parallel individual pin fetch
      const pins = ['v0', 'v2', 'v3', 'v4', 'v5', 'v6'];
      const result = {};
      await Promise.all(pins.map(async (pin) => {
        try {
          const r = await fetch(`https://blynk.cloud/external/api/get?token=${BLYNK_AUTH}&${pin}`);
          if (r.ok) {
            const raw = await r.text();
            result[pin] = raw.replace(/["\r\n]/g, '').trim();
          }
        } catch (e) {}
      }));
      return result;
    }

    async function pollBlynk() {
      try {
        const data = await fetchAllPins();

        if (Object.keys(data).length === 0) {
          throw new Error("No data returned");
        }

        document.getElementById('connDot').className = "dot connected";
        document.getElementById('connText').innerText = "LIVE CLOUD";

        const ip = data.v2 || data.V2;
        document.getElementById('lastSeenText').innerText = ip && ip !== "0.0.0.0" ? `ESP32 IP: ${ip}` : "Device Online";

        const v0 = getPin(data, 0);
        const v3 = getPin(data, 3);
        const v4 = getPin(data, 4);
        const v5 = getPin(data, 5);
        const v6 = getPin(data, 6);

        updateUI({
          has_leak: (v0 === 1),
          has_error: (v0 === 2),
          inlet: (v3 === 1),
          outlet: (v4 === 1),
          unit: (v5 === 1),
          external: (v6 === 1),
          external_err: (v6 === 2)
        });

      } catch (err) {
        document.getElementById('connDot').className = "dot";
        document.getElementById('connText').innerText = "CONNECTING...";
        document.getElementById('lastSeenText').innerText = "Reaching Blynk Cloud...";
      }
    }

    function updateUI(state) {
      const orb = document.getElementById('orbRing');
      const icon = document.getElementById('masterIcon');
      const title = document.getElementById('masterStatusText');
      const alertBanner = document.getElementById('alertBanner');
      const bannerZoneText = document.getElementById('bannerZoneText');

      // Update Individual Cards
      setZoneCard('cardInlet', 'txtInlet', state.inlet, false);
      setZoneCard('cardOutlet', 'txtOutlet', state.outlet, false);
      setZoneCard('cardUnit', 'txtUnit', state.unit, false);
      setZoneCard('cardExt', 'txtExt', state.external, state.external_err);

      // Collect specific breached zones
      let breached = [];
      if (state.inlet) breached.push("INLET PLUMBING");
      if (state.outlet) breached.push("OUTLET PLUMBING");
      if (state.unit) breached.push("UNIT PLUMBING");
      if (state.external) breached.push("EXTERNAL RS485");

      // Critical Leak
      if (state.has_leak || breached.length > 0) {
        orb.className = "orb-ring alarm";
        icon.style.fill = "var(--alarm)";
        icon.innerHTML = '<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>';
        title.innerText = "CRITICAL LEAK";
        title.style.color = "var(--alarm)";

        const zoneString = breached.length ? breached.join(" + ") : "ACTIVE LEAK DETECTED";
        bannerZoneText.innerText = zoneString;
        alertBanner.style.display = "flex";

        if (!isSilenced) {
          const modal = document.getElementById('emergencyModal');
          document.getElementById('modalZoneText').innerText = zoneString;
          modal.style.display = "flex";

          if (!alarmInterval) {
            playSirenTone();
            alarmInterval = setInterval(playSirenTone, 800);
          }
        }
      } else {
        isSilenced = false;
        alertBanner.style.display = "none";
        document.getElementById('emergencyModal').style.display = "none";
        if (alarmInterval) {
          clearInterval(alarmInterval);
          alarmInterval = null;
        }

        // Sensor Fault
        if (state.has_error) {
          orb.className = "orb-ring error";
          icon.style.fill = "var(--warn)";
          icon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>';
          title.innerText = "SENSOR FAULT";
          title.style.color = "var(--warn)";
        } else {
          orb.className = "orb-ring";
          icon.style.fill = "var(--safe)";
          icon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>';
          title.innerText = "SYSTEM SECURE";
          title.style.color = "var(--safe)";
        }
      }
    }

    function setZoneCard(cardId, txtId, isWet, isError) {
      const card = document.getElementById(cardId);
      const txt = document.getElementById(txtId);

      card.classList.remove('alarm', 'fault');

      if (isError) {
        card.classList.add('fault');
        txt.innerText = "FAULT";
      } else if (isWet) {
        card.classList.add('alarm');
        txt.innerText = "⚠️️ LEAK DETECTED";
      } else {
        txt.innerText = "✓ DRY / SAFE";
      }
    }

    setInterval(pollBlynk, 1200);
    pollBlynk();
  </script>
</body>
</html>
